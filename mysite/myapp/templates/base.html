<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Сегодня новый день!</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        .container { width: 80%; margin: auto; overflow: hidden; }
        header { background: #333; color: #fff; padding-top: 10px; min-height: 70px; border-bottom: #0779e4 3px solid; }
        header a { color: #fff; text-decoration: none; text-transform: uppercase; font-size: 16px; }
        .navbar { display: flex; justify-content: space-between; list-style: none; }
        .navbar li { padding: 0 20px 0 20px; }
        .content { padding: 20px; }
        .recipe-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; }
        img { max-width: 100%; height: auto; }
    </style>

</head>
<body>
    <header>
        <div class="container">
            <nav>
                <ul class="navbar">
                    <li><a href="/">Главная</a>&nbsp;</li>
                     <li><a href="/about">о проекте</a>&nbsp;</li>
                </ul>

            </nav>
        </div>
    </header>

    <div class="container content">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
