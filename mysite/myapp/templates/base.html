
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сегодня новый день!</title>

     <style>
        body {
            background-image: url('/media/light_fon.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            font-family: sans-serif; margin: 0; padding: 0;
        }
        .container { width: 80%; margin: auto; overflow: hidden; }
        header { background: #66b8f2fb; color: #fff; padding-top: 10px; min-height: 70px; }
        header a { color: #fff; text-decoration: none; text-transform: uppercase; }
        .navbar { display: flex; justify-content: space-between; list-style: none; padding: 0; }
        .navbar li { padding: 0 20px; }
        .content { padding: 20px; }
        .footer { width: 80%; margin: auto; color: #cccaca; text-align: center; text-transform: uppercase; font-size: 11px; }
    </style>

</head>
<body>
    <div class="body">
    <header>
        <div class="container">
            <nav>
                <ul class="navbar">
                    <li><a href="/">Главная</a>&nbsp;</li>
                     <li><a href="/about">о проекте</a>&nbsp;</li>
                </ul>

            </nav>
        </div>
    </header>

    <div class="container content">
        {% block content %}
        {% endblock %}
    </div>
 </div>

<footer class="footer">

        <br/><br/><br/><br/><br/><br/><br/><br/><br/><br/><br/>
        <div>
            <h3>Спасибо за то, что посетили мой сайт! </h3>
        </div>
        <div>
            <p>Текущее время: <time id="currentTime"></time></p>

            <script>
              var timeElement = document.getElementById('currentTime');
              setInterval(function () {
                var currentTime = new Date();
                timeElement.textContent = currentTime.toLocaleTimeString();
              }, 1000);
            </script>
        </div>

</footer>
</body>
</html>
